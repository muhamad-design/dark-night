<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Dark Night test harness</title>
  <style>
    body { font: 13px/1.5 ui-monospace, Menlo, monospace; margin: 20px; background: #fdfdfb; color: #222; }
    #out { white-space: pre; }
    .pass { color: #1a7f37; }
    .fail { color: #c00; font-weight: bold; }
    #sample { border: 1px solid #ccc; padding: 10px; margin: 12px 0; background: #f0efe9; }
    .caret { width: 0; height: 0; border: 6px solid transparent; border-top-color: #333; }
  </style>
</head>
<body>
  <h1>Dark Night harness</h1>
  <div id="sample">
    <p>Sample light content <a id="plainLink" href="#">link</a></p>
    <p><a id="spanLink" href="#"><span id="spanInLink">span inside link</span></a></p>
    <a id="cardLink" href="#">
      <article>
        <h3 id="cardHeading">Card headline</h3>
        <p id="cardBody">Card body text that must not turn link-blue.</p>
      </article>
    </a>
    <button id="btn">Button</button>
    <input id="inp" placeholder="Input" />
    <div class="caret" id="caret"></div>
    <div id="gradientBox" style="background-image: linear-gradient(#fff, #eee); padding: 4px">gradient band</div>
    <img id="img1" alt="" width="8" height="8" />
    <!-- a site design system that fights back with !important -->
    <div class="site-card" id="siteImportant">class + !important</div>
    <div id="siteIdImportant">id + !important</div>
    <svg width="10" height="10"><rect id="blackIcon" width="10" height="10" fill="#000" /></svg>
    <svg width="10" height="10"><rect id="colourIcon" width="10" height="10" fill="#dc3232" /></svg>
    <svg width="10" height="10"><mask id="m"><rect id="maskedBlack" width="10" height="10" fill="#000" /></mask></svg>
    <div id="shadowHost"></div>
    <!-- stands in for a custom element awaiting its definition -->
    <div id="upgradeHost"></div>
    <!-- a real one: defined later, mid-suite, exactly like a code-split bundle -->
    <late-el id="lateComponent"></late-el>
    <div id="accent">accent bar drawn with ::before</div>
  </div>
  <div id="out">running...</div>

  <style>
    /* Stands in for a real site's stylesheet. Both rules outrank a bare `*`. */
    .site-card { background-color: #ffffff !important; }
    #siteIdImportant { background-color: #ffffff !important; }
    /* A coloured accent bar - the classic decorative pseudo-element. */
    #accent::before { content: ""; display: block; width: 20px; height: 3px; background-color: #2563eb; }
  </style>
  <script>
    // Built before content.js loads, so the initial scan has to find them.
    (() => {
      const root = document.getElementById("shadowHost").attachShadow({ mode: "open" });
      root.innerHTML = '<div id="sInner">shadow surface</div><span id="sNestedHost"></span>';
      const nested = root.getElementById("sNestedHost").attachShadow({ mode: "open" });
      nested.innerHTML = '<div id="sDeep">nested shadow surface</div>';
    })();
  </script>

<script>
// ---------------------------------------------------------------------------
// chrome API mock. Must exist before content.js loads.
// ---------------------------------------------------------------------------
const params = new URLSearchParams(location.search);
const MODE = params.get("suite") || "main";

// Both suites that need to inspect the state between the settings read being
// issued and its callback hold that read open. Only "pending" also makes writes
// dispatch synchronously; "hint" wants ordinary async writes.
const HOLD_SYNC = MODE === "pending" || MODE === "hint";

const store = {};
const localStore = {};
const changeListeners = [];
const listenerErrors = [];
let heldGet = null;
let localWrites = 0;

// Reloading, disabling or updating an extension does not merely stop delivering
// callbacks to the frames still running its content script: runtime.id goes
// away and every chrome.* call throws synchronously from then on. Modelled, or
// a suite about the invalidated frame would pass against code that crashes on a
// real reload.
function bridge() {
  if (!chrome.runtime.id) throw new Error("Extension context invalidated.");
}

window.chrome = {
  runtime: { id: "dark-night-test", lastError: null },
  storage: {
    sync: {
      get(defaults, cb) {
        bridge();
        const snapshot = { ...defaults, ...store };
        if (HOLD_SYNC) heldGet = () => cb(snapshot);   // harness controls delivery
        else setTimeout(() => cb(snapshot), 0);
      },
      set(patch, cb) {
        bridge();
        const changes = {};
        for (const [k, v] of Object.entries(patch)) {
          changes[k] = { oldValue: store[k], newValue: v };
          store[k] = v;
        }
        const dispatch = () => {
          // Chrome isolates a throwing listener; model that, and record it so a
          // crash surfaces as a failure instead of a hang.
          changeListeners.forEach((fn) => {
            try { fn(changes, "sync"); }
            catch (err) { listenerErrors.push(err && (err.message || String(err))); }
          });
          if (cb) cb();
        };
        if (MODE === "pending") dispatch();
        else setTimeout(dispatch, 0);
      }
    },
    // The remembered-verdict hint. A separate area from sync on purpose - it is
    // a per-machine observation, not a synced preference - so it gets its own
    // store here too, and never fires the sync change listeners.
    local: {
      get(defaults, cb) {
        bridge();
        const snapshot = { ...defaults, ...localStore };
        setTimeout(() => cb(snapshot), 0);
      },
      set(patch, cb) {
        bridge();
        localWrites++;
        setTimeout(() => {
          Object.assign(localStore, patch);
          if (cb) cb();
        }, 0);
      }
    },
    onChanged: { addListener(fn) { changeListeners.push(fn); } }
  }
};

const set = (patch) => new Promise((r) => chrome.storage.sync.set(patch, r));
const tick = (ms = 30) => new Promise((r) => setTimeout(r, ms));
// Chrome throttles timers in an unfocused tab, so anything racing a real-time
// recheck must poll for the condition instead of sleeping a fixed span.
async function waitUntil(fn, ms = 9000) {
  const t0 = performance.now();
  while (performance.now() - t0 < ms) {
    if (fn()) return true;
    await tick(20);
  }
  return fn();
}

// ---------------------------------------------------------------------------
const results = [];
function check(name, cond, detail) {
  results.push({ name, pass: !!cond, detail: detail === undefined ? "" : String(detail) });
  paint();
}
function paint(done) {
  const failed = results.filter((r) => !r.pass).length;
  document.getElementById("out").innerHTML =
    results.map((r) =>
      `<span class="${r.pass ? "pass" : "fail"}">${r.pass ? "PASS" : "FAIL"}</span>  ${r.name}${r.detail ? "  [" + r.detail + "]" : ""}`
    ).join("\n") +
    `\n\n${results.length - failed}/${results.length} passed` +
    (done ? "" : "  ... still running");
}

const READY = "data-dark-night-ready";

// The real pre-paint sheet, put on the page the way the service worker
// registers it - before content.js runs - and a transparent <body>, which is
// what most light sites actually have. Injected as a <style> from the fetched
// text rather than a <link> so it is guaranteed to be in effect, not still
// loading, when the first measurement happens.
let EARLY_CSS_TEXT = "";
async function installEarlyCss() {
  EARLY_CSS_TEXT = await (await fetch("../early.css?t=" + performance.now(), { cache: "no-store" })).text();
  const s = document.createElement("style");
  s.id = "early-css-under-test";
  s.textContent = EARLY_CSS_TEXT;
  document.head.appendChild(s);
  document.body.style.backgroundColor = "transparent";
}

const styleEl = () => document.getElementById("dark-night-style");
const css = () => (styleEl() ? styleEl().textContent : "");
const htmlFilter = () => getComputedStyle(document.documentElement).filter;
const bodyBg = () => getComputedStyle(document.body).backgroundColor;
const colorOf = (id) => getComputedStyle(document.getElementById(id)).color;
const norm = (s) => s.replace(/\s+/g, " ").trim();
// Comments in the generated sheet mention selectors by name; assertions about
// selector shape have to look at the rules, not the prose about them.
const bare = () => css().replace(/\/\*[\s\S]*?\*\//g, "");
// Every declared rule must survive the CSS parser: a selector list is dropped
// whole when any one of its selectors is unrecognised.
function allRulesParse() {
  const s = document.createElement("style");
  s.textContent = css();
  document.head.appendChild(s);
  const declared = (bare().match(/\{/g) || []).length;
  const parsed = s.sheet.cssRules.length;
  s.remove();
  return { ok: parsed === declared, detail: parsed + " parsed / " + declared + " declared" };
}

// Theme dark tokens. Chrome reports oklch colours in their own space, so these
// are the computed-style forms of --accent, --foreground and --background.
const LINK = "oklch(0.8 0.18 195)";   // --accent
const TEXT = "oklch(0.96 0 0)";       // --foreground
const DARK = "rgb(21, 21, 21)";       // --background #151515
const CARD = "rgb(28, 28, 28)";       // --card #1c1c1c

// The palette is no longer monochrome - it is the theme's. What matters now is
// that the injected sheet uses the theme's own token values and nothing else,
// so a themed page and the popup cannot drift apart.
const THEME_TOKENS = {
  background: "#151515",
  card: "#1c1c1c",
  foreground: "oklch(96% 0 0)",
  muted: "oklch(62% 0 0)",
  border: "#ffffff1a",
  accent: "oklch(80% 0.18 195)",
  violet: "oklch(68% 0.22 295)"
};

// Any colour literal in the sheet that is not one of the theme's tokens (or
// one of the few mechanism colours that are not palette at all).
function offPalette(cssText) {
  const allowed = new Set([
    ...Object.values(THEME_TOKENS).map((v) => v.toLowerCase()),
    "oklch(38% 0 0)",      // scrollbar thumb, theme greyscale
    "#eaeaea",             // filter mode: inverts to #151515
    "rgba(0, 0, 0, 0.7)"   // elevation drop shadow
  ]);
  const declarations = cssText
    .replace(/\/\*[\s\S]*?\*\//g, "")     // prose mentions colours by name
    .replace(/\[[^\]]*\]/g, "");           // [fill="#000"] matches a colour, is not one
  const found = declarations.match(/#[0-9a-f]{3,8}\b|oklch\([^)]*\)|rgba?\([^)]*\)/gi) || [];
  return [...new Set(found.map((c) => c.toLowerCase()))].filter((c) => !allowed.has(c));
}

// ---------------------------------------------------------------------------
// Load the REAL content.js, instrumented to expose internals. The production
// file is never modified - the transform happens here at test time.
// ---------------------------------------------------------------------------
async function loadContentScript() {
  const src = await (await fetch("../content.js?" + MODE + "&t=" + performance.now(), { cache: "no-store" })).text();
  const marker = /\}\)\(\);\s*$/;
  if (!marker.test(src)) throw new Error("content.js does not end in the expected IIFE form");
  new Function(src.replace(marker,
    `  window.__mm = {
       buildCss, buildDynamicCss, buildFilterCss, cssFilterValue,
       undoFilterValue, effective, mediaUndo,
       siteDisabled, HOST, resolveHost, DEFAULTS, READY_ATTR, SP, colorIsDark,
       checkNativeDark, detectTimers,
       appliedFilter, readAncestorFilter, IS_TOP,
       get settings() { return settings; },
       get observer() { return observer; },
       get deadCheck() { return deadCheck; },
       get nativeDark() { return nativeDark; },
       get ancestorFilter() { return ancestorFilter; }
     };
   })();`
  ))();
}

// ---------------------------------------------------------------------------
// Suite: detection runs while the PRE-PAINT sheet is still on the page.
//
// early.css paints <html> #181a1b until content.js releases it by setting
// data-dark-night-ready. A light site that leaves <body> transparent - very
// common, most sites paint only their own containers - has nothing else for the
// measurement to read, so if the release happens after the first measurement
// the extension sees the pre-paint sheet's own dark colour, concludes the site
// is already dark, and switches itself off on a white page.
//
// Reproduced faithfully: the real early.css, injected the way the service
// worker registers it, before content.js loads.
// ---------------------------------------------------------------------------
async function earlyCssSuite() {
  await waitUntil(() => !!window.__mm.settings);
  await tick(60);

  check("earlycss: the pre-paint sheet really is in effect during the read",
    EARLY_CSS_TEXT.includes("data-dark-night-ready"), EARLY_CSS_TEXT.trim().split("\n").pop());
  // The site's own declaration, not the computed value - once the theme is
  // applied the computed background is the theme's, which says nothing about
  // what the measurement had to work with.
  check("earlycss: the body under test is transparent, as on a real site",
    document.body.style.backgroundColor === "transparent", document.body.style.backgroundColor);

  // The whole point: this page is LIGHT. It must be themed.
  check("earlycss: light page is not mistaken for a dark one",
    window.__mm.nativeDark === false, "nativeDark=" + window.__mm.nativeDark);
  check("earlycss: light page is themed", !!styleEl());
  check("earlycss: pre-paint sheet released", document.documentElement.hasAttribute(READY));

  // And the release must not have been bought by delaying the theme: the sheet
  // early.css exists to cover for has to be in place when it is released.
  check("earlycss: theme was in place before the pre-paint sheet was released",
    !!styleEl() && getComputedStyle(document.body).backgroundColor === DARK,
    getComputedStyle(document.body).backgroundColor);

  // A genuinely dark site with a transparent body still has to be recognised -
  // the fix must not simply blind the fallback path.
  document.documentElement.style.backgroundColor = "#101112";
  await set({ autoSkipNativeDark: false });
  await set({ autoSkipNativeDark: true });
  await waitUntil(() => !styleEl());
  check("earlycss: a real dark page with a transparent body still steps aside",
    !styleEl() && window.__mm.nativeDark === true, "nativeDark=" + window.__mm.nativeDark);
  document.documentElement.style.backgroundColor = "";
}

// ---------------------------------------------------------------------------
// Suite: a write that lands between the initial read and its callback
// ---------------------------------------------------------------------------
async function pendingSuite() {
  check("pending: initial read is still in flight", !!heldGet && !styleEl());
  await set({ mode: "filter", brightness: 130 });   // dispatched while settings === null
  check("pending: nothing applied yet", !styleEl());
  heldGet();                                        // stale snapshot arrives now
  await tick();
  check(
    "pending: change replayed, not dropped",
    css().includes("invert(1)"),
    "mode=" + (window.__mm.settings || {}).mode
  );
  check(
    "pending: every replayed key survived",
    window.__mm.settings.brightness === 130,
    "brightness=" + window.__mm.settings.brightness
  );
  check(
    "pending: replayed value reached the page",
    htmlFilter().includes("brightness(1.3)"),
    htmlFilter()
  );
}

// ---------------------------------------------------------------------------
// Suite: a page that is already dark before the extension looks at it.
// The body is painted dark in the runner, BEFORE content.js loads, because the
// verdict is taken as soon as the settings read resolves.
// ---------------------------------------------------------------------------
async function nativeDarkSuite() {
  // --- the kickoff verdict: an already-dark page is left alone ---
  await waitUntil(() => window.__mm.nativeDark === true);
  check("nativedark: verdict is dark", window.__mm.nativeDark === true);
  check("nativedark: already-dark page is not themed", !styleEl());
  check("nativedark: page keeps its own background", bodyBg() === "rgb(17, 18, 19)", bodyBg());
  check("nativedark: pre-paint sheet still released",
    document.documentElement.hasAttribute("data-dark-night-ready"));

  // --- the scheduled recheck, in real time ---
  // The page flips itself light with no settings change at all; one of the
  // delayed passes has to notice and bring the theme back on its own. Ordered
  // by events, not by clock: whether the flip lands before the 1s or the 3s
  // recheck, some recheck measures the light page - so tab throttling, which
  // stretches this suite's own awaits past those marks, cannot break it.
  document.body.style.backgroundColor = "#ffffff";
  const rethemed = await waitUntil(() => !!styleEl());
  check("nativedark: page turned light, a scheduled recheck re-themes", rethemed);
  check("nativedark: verdict followed the page", window.__mm.nativeDark === false);
  // The measurement lifts the injected sheet for the read: painted dark by our
  // own theme, the page must still measure as light underneath.
  check("nativedark: measurement not fooled by our own dark theme",
    bodyBg() === DARK && window.__mm.nativeDark === false, bodyBg());

  // --- the colour classifier, on the real function ---
  const dark = window.__mm.colorIsDark;
  check("classify: white is light", dark("rgb(255, 255, 255)") === false);
  check("classify: near-black is dark", dark("rgb(17, 18, 19)") === true);
  check("classify: mid grey is light", dark("rgb(160, 160, 160)") === false);
  check("classify: fully transparent is unknown", dark("rgba(0, 0, 0, 0)") === null);
  check("classify: translucent is unknown", dark("rgba(20, 20, 20, 0.3)") === null);
  check("classify: opaque rgba is classified", dark("rgba(20, 20, 20, 0.9)") === true);
  check("classify: oklch dark (Tailwind 4 syntax)", dark("oklch(0.2 0 0)") === true);
  check("classify: oklch light", dark("oklch(0.95 0 0)") === false);
  check("classify: oklch percentage lightness", dark("oklch(20% 0 0)") === true);
  check("classify: lab dark", dark("lab(20 0 0)") === true);
  check("classify: lab light", dark("lab(90 0 0)") === false);
  check("classify: unparsed keyword is unknown", dark("ButtonFace") === null);
  // regression: the modern notations carry PERCEPTUAL lightness, which says
  // nothing about luminance once chroma is involved, so a fixed cut on the first
  // component was wrong in a way no threshold fixes. Tailwind's indigo-700
  // computes to this and scored 0.457 against a 0.45 cut - light, on a page whose
  // relative luminance is 0.069. Every notation goes through one luminance rule
  // now, so the two spellings of the same colour have to agree.
  check("classify: a saturated oklch is judged by luminance, not lightness",
    dark("oklch(0.457 0.24 277.02)") === true, String(dark("oklch(0.457 0.24 277.02)")));
  check("classify: the same colour in sRGB agrees",
    dark("rgb(67, 45, 215)") === dark("oklch(0.457 0.24 277.02)"),
    dark("rgb(67, 45, 215)") + " vs " + dark("oklch(0.457 0.24 277.02)"));
  check("classify: a saturated LIGHT oklch is still light",
    dark("oklch(0.85 0.18 90)") === false, String(dark("oklch(0.85 0.18 90)")));
  // Spaces the regex branch does not name, and hex, now that the browser's own
  // colour engine answers for anything the fast path does not.
  check("classify: color(srgb-linear) dark", dark("color(srgb-linear 0.02 0.02 0.03)") === true,
    String(dark("color(srgb-linear 0.02 0.02 0.03)")));
  check("classify: color(xyz) dark", dark("color(xyz 0.01 0.01 0.01)") === true,
    String(dark("color(xyz 0.01 0.01 0.01)")));
  check("classify: hex is classified", dark("#101112") === true && dark("#fefefe") === false);

  // Alpha in the modern syntaxes. Chrome keeps these notations in the computed
  // value, alpha and all, and a Tailwind 4 `bg-black/10` on <body> computes to
  // exactly oklab(0 0 0 / 0.1). Reading only the legacy rgba() alpha meant that
  // faint tint on a white page was scored as opaque black - and <body> is
  // measured first, so it decided the whole verdict and the engine switched
  // itself off on a white page.
  check("classify: translucent oklab is unknown, like translucent rgba",
    dark("oklab(0 0 0 / 0.1)") === null, String(dark("oklab(0 0 0 / 0.1)")));
  check("classify: translucent oklch is unknown", dark("oklch(0.15 0 0 / 0.3)") === null);
  check("classify: translucent lab is unknown", dark("lab(20 0 0 / 0.2)") === null);
  check("classify: fully transparent modern syntax is unknown",
    dark("oklab(0 0 0 / 0)") === null);
  check("classify: percentage alpha is understood", dark("oklch(0.15 0 0 / 20%)") === null);
  check("classify: opaque modern syntax still classifies",
    dark("oklch(0.15 0 0 / 0.9)") === true && dark("oklch(0.95 0 0 / 1)") === false);

  // color(srgb ...) is what Chrome returns for a background built with
  // color-mix(in srgb, ...) or relative colour syntax. Unparsed, a dark page
  // using either read as "cannot tell" and filter mode inverted it to white.
  check("classify: color(srgb) dark", dark("color(srgb 0.07 0.09 0.11)") === true,
    String(dark("color(srgb 0.07 0.09 0.11)")));
  check("classify: color(srgb) light", dark("color(srgb 1 1 1)") === false);
  check("classify: color(display-p3) dark", dark("color(display-p3 0.07 0.09 0.11)") === true);
  check("classify: translucent color(srgb) is unknown",
    dark("color(srgb 0 0 0 / 0.2)") === null);

  // --- re-measurement on a policy nudge, immediately ---
  // Back to dark: toggling auto-skip re-takes the verdict without waiting for
  // any timer, and the fresh verdict steps aside again.
  document.body.style.backgroundColor = "#111213";
  await set({ autoSkipNativeDark: false });
  await set({ autoSkipNativeDark: true });
  await waitUntil(() => !styleEl());
  check("nativedark: policy nudge re-measures and steps aside", !styleEl(), bodyBg());
  check("nativedark: verdict is dark again", window.__mm.nativeDark === true);

  // --- forcedSites overrides the verdict ---
  const host = window.__mm.HOST;
  await set({ forcedSites: [host] });
  await waitUntil(() => !!styleEl());
  check("nativedark: forcing the site themes it anyway", !!styleEl());
  check("nativedark: forced page renders the dark theme", bodyBg() === DARK, bodyBg());

  await set({ forcedSites: [] });
  await waitUntil(() => !styleEl());
  check("nativedark: releasing the force steps aside again", !styleEl());

  // --- the feature toggle ---
  await set({ autoSkipNativeDark: false });
  await waitUntil(() => !!styleEl());
  check("nativedark: auto-skip off themes the dark page", !!styleEl());
  check("nativedark: auto-skip off renders dark theme", bodyBg() === DARK, bodyBg());

  await set({ autoSkipNativeDark: true });
  await waitUntil(() => !styleEl());
  check("nativedark: auto-skip back on steps aside", !styleEl());

  // --- the classifier bug, end to end ---
  // A white page carrying a faint dark tint in a modern colour syntax. Before
  // alpha was read in that branch this measured "already dark" and the engine
  // removed itself from a white page.
  document.documentElement.style.backgroundColor = "#ffffff";
  document.body.style.backgroundColor = "color-mix(in oklab, black 10%, transparent)";
  check("nativedark: the tint really does compute to modern syntax with alpha",
    /\/\s*0?\.1/.test(getComputedStyle(document.body).backgroundColor) ||
      getComputedStyle(document.body).backgroundColor.startsWith("rgba"),
    getComputedStyle(document.body).backgroundColor);
  await set({ autoSkipNativeDark: false });
  await set({ autoSkipNativeDark: true });
  await waitUntil(() => !!styleEl());
  check("nativedark: a faint tint on a white page is not 'already dark'",
    !!styleEl() && window.__mm.nativeDark === false, "nativeDark=" + window.__mm.nativeDark);
  document.body.style.backgroundColor = "";
  document.documentElement.style.backgroundColor = "";

  // --- the remembered verdict ---
  // Written only from a real measurement, so the next load can theme the gap
  // before DOMContentLoaded the way this one ended.
  // The verdict is already light (the theme is back on); this waits for the
  // write behind it, which is two storage round-trips rather than instant.
  await waitUntil(() =>
    Array.isArray(localStore.nativeDarkHosts) &&
    !localStore.nativeDarkHosts.includes(window.__mm.HOST));
  check("hint: a light page is not remembered as dark",
    !(localStore.nativeDarkHosts || []).includes(window.__mm.HOST),
    JSON.stringify(localStore.nativeDarkHosts));

  document.body.style.backgroundColor = "#111213";
  await set({ autoSkipNativeDark: false });
  await set({ autoSkipNativeDark: true });
  await waitUntil(() => (localStore.nativeDarkHosts || []).includes(window.__mm.HOST));
  check("hint: a dark page is remembered",
    (localStore.nativeDarkHosts || []).includes(window.__mm.HOST),
    JSON.stringify(localStore.nativeDarkHosts));

  // Turning the feature off must not erase what the last real look found - that
  // "false" means "not measured", not "measured light".
  const beforeOff = JSON.stringify(localStore.nativeDarkHosts);
  await set({ autoSkipNativeDark: false });
  await tick(120);
  check("hint: switching auto-skip off does not erase the remembered verdict",
    JSON.stringify(localStore.nativeDarkHosts) === beforeOff,
    JSON.stringify(localStore.nativeDarkHosts));
  await set({ autoSkipNativeDark: true });
  await waitUntil(() => !styleEl());
}

// ---------------------------------------------------------------------------
// Suite: the remembered verdict seeds the next load.
//
// The hint exists because the first measurement cannot happen before
// DOMContentLoaded, while the theme goes on as soon as the settings read
// resolves. It must be a hint and not a decision: this page is LIGHT while the
// hint says dark, so the theme has to be withheld at first and then applied the
// moment the real measurement disagrees.
// ---------------------------------------------------------------------------
async function hintSuite() {
  // The settings read is held open, so this is the state the page is in during
  // the window the hint exists to cover: hint consumed, nothing applied yet.
  // Both reads are in flight together, so the hint is awaited rather than
  // assumed to have landed first.
  await waitUntil(() => !!heldGet);
  await waitUntil(() => window.__mm.nativeDark === true);
  check("hint: in place while the settings read is still outstanding",
    window.__mm.nativeDark === true, "nativeDark=" + window.__mm.nativeDark);

    el.remove();

    return got;
  };
  check("media: the fullscreen reset outranks the reversal, not just follows it",
    cascadeWinner(dynTuned, "video") === "none", cascadeWinner(dynTuned, "video"));
  // The other half of the same cascade: a fullscreen element that is NOT media
  // takes the forward filter, so media inside it stays paired with something.
  check("media: a fullscreen non-media element takes the forward filter",
    /^contrast\(0\.8\) brightness\(1\.3\)/.test(cascadeWinner(dynTuned, "div")),
    cascadeWinner(dynTuned, "div"));
  // Located by shape rather than by substring: the top-layer pass names img in a
  // :not(), which is the opposite of applying a filter to one.
  check("media: opting in hands media straight to the root filter",
    !mediaRule(B.buildDynamicCss({ ...B.DEFAULTS, brightness: 130, themeImages: true })),
    norm(mediaRule(B.buildDynamicCss({ ...B.DEFAULTS, brightness: 130, themeImages: true }))));

  // --- the slider filter reaches a subframe from the top frame ---------------
  // A filter on <html> rasterises the whole subtree, and an iframe's painted
  // output is part of it, so a subframe emitting its own copy of the root rule
  // had the sliders applied twice - and since its media rule reverses them only
  // once, one copy of the adjustment survived on every image inside an iframe.
  // Dynamic mode had no gate at all here; filter mode has always had one.
  //
  // Located by shape, not by substring: the sheet also carries
  // `html, body { background-color }` and `html { scrollbar-color }`, and prose
  // that mentions <html> by name.
  const rootFilter = (css) => (css.match(/^html[^,{\n]*\{ filter:[^\n]*/m) || [""])[0];
  const TUNED = { ...B.DEFAULTS, brightness: 130, contrast: 80 };
  const DYN_TOP = ancestorOf(TUNED, "dynamic");
  const dynSub = B.buildDynamicCss(TUNED, false, DYN_TOP);
  check("frames: the top frame carries the root slider filter",
    !!rootFilter(dynTuned), norm(rootFilter(dynTuned)));
  check("frames: the root slider filter applies once, in the top frame only",
    !rootFilter(dynSub), norm(rootFilter(dynSub)));
  // Gating the root rule must not take the reversal with it: the top frame's
  // filter still reaches media in here, so it still needs the same reversal -
  // the identical one, since it is reversing the identical single application.
  check("frames: a subframe still reverses the sliders on its own media",
    norm(mediaRule(dynSub)) === norm(mediaRule(dynTuned)) && /filter:/.test(mediaRule(dynSub)),
    norm(mediaRule(dynSub)));
  // The top-layer pass is gated with it, and for the same reason: a modal in a
  // subframe is painted into that frame, which the top frame's filter already
  // rasterises, so a second copy would apply the sliders twice there too.
  const topLayerPass = (css) =>
    css.split("\n").filter((l) => /^(:modal|\[popover\]|:fullscreen)[^,{\n]*\{ filter:/.test(l));
  check("frames: the top frame carries the top-layer slider pass",
    topLayerPass(dynTuned).length === 3, topLayerPass(dynTuned).join(" | ") || "none");
  check("frames: the top-layer pass applies once, in the top frame only",
    topLayerPass(dynSub).length === 0, topLayerPass(dynSub).join(" | "));
  // And nothing else moved: dynamic mode paints per frame, so a subframe needs
  // every other rule in full. The sheets must differ by exactly the rules that
  // carry the forward filter.
  const linesOf = (c) => c.split("\n").map(norm).filter(Boolean);
  const dropped = linesOf(dynTuned).filter((l) => !linesOf(dynSub).includes(l));
  check("frames: the forward filter rules are the only ones a subframe drops",
    dropped.length === 4 &&
      dropped.every((l) => /^(html|:modal|\[popover\]|:fullscreen)[^,{]*\{ filter:/.test(l)),
    "dropped: " + (dropped.join(" | ") || "nothing"));

  // --- the reversal is paired with a real ancestor filter, or it is absent ---
  // A reversal only makes sense against a forward filter that is genuinely
  // being applied above. Two ways that fails, both reachable: the top document
  // may not be running this script at all (a file:// page without file access,
  // another extension's page) while an http(s) subframe of it is; and HOST is
  // read from ancestorOrigins, which is the literal string "null" for an opaque
  // origin, so the subframe falls back to its own hostname and can disagree
  // with the top about the sliders, the engine, and whether to theme at all.
  // Neither is knowable from inside the subframe, so it is told - and until it
  // is told, it reverses nothing.
  check("pairing: a subframe with no filtering ancestor reverses nothing",
    !/filter:/.test(mediaRule(B.buildDynamicCss(TUNED, false, null))),
    norm(mediaRule(B.buildDynamicCss(TUNED, false, null))));
  check("pairing: and it still paints the rest of its own sheet",
    B.buildDynamicCss(TUNED, false, null).includes(THEME_TOKENS.background));
  // In filter mode there IS nothing else: pinning color-scheme light only makes
  // sense as a light source for an inversion, and without one it forces a site's
  // light theme onto a page nobody is inverting.
  check("pairing: an unpaired filter-mode subframe emits nothing at all",
    B.buildFilterCss(TUNED, false, null) === "",
    JSON.stringify(B.buildFilterCss(TUNED, false, null)));
  check("pairing: nor does it compensate for a top frame running the other engine",
    B.buildFilterCss(TUNED, false, ancestorOf(TUNED, "dynamic")) === "",
    JSON.stringify(B.buildFilterCss(TUNED, false, ancestorOf(TUNED, "dynamic"))));
  // The top frame is never gated on this - it applies its own filter, so it is
  // its own pair.
  check("pairing: the top frame is unaffected by having no ancestor",
    !!rootFilter(B.buildDynamicCss(TUNED, true, null)) &&
    B.buildFilterCss(TUNED, true, null).includes("invert(1)"));

  // The reversal follows the ANCESTOR's values, not this frame's own. Under a
  // diverged host those differ, and the reversal is worthless unless it is the
  // exact reverse of what was actually applied.
  const diverged = B.buildDynamicCss({ ...B.DEFAULTS }, false, DYN_TOP);
  check("pairing: the reversal reverses the ancestor's sliders, not this frame's",
    norm(mediaRule(diverged)) === norm(mediaRule(dynTuned)), norm(mediaRule(diverged)));
  // Down to whether it inverts: a dynamic-mode frame inside a filter-mode top is
  // still sitting inside invert(1), and a reversal without it is a negative.
  const underInvert = B.buildDynamicCss({ ...B.DEFAULTS }, false, FILTER_TOP);
  check("pairing: a dynamic subframe under a filter-mode top reverses the invert too",
    /invert\(1\) hue-rotate\(180deg\)/.test(mediaRule(underInvert)), norm(mediaRule(underInvert)));
  // And themeImages is the ancestor's answer too: it decides whether media in
  // its subtree was meant to carry the filter in the first place.
  check("pairing: an ancestor that themes its images asks for no reversal",
    !/filter:/.test(mediaRule(
      B.buildDynamicCss(TUNED, false, { ...DYN_TOP, themeImages: true }))));

  // --- what the top frame reports ------------------------------------------
  // The other half of the pair: a subframe is only ever as right as this is.
  await set({ mode: "dynamic", brightness: 130, contrast: 80, enabled: true, disabledSites: [] });
  await tick();
  check("report: a filtering top frame reports its sliders",
    JSON.stringify(B.appliedFilter()) === JSON.stringify(ancestorOf(TUNED, "dynamic")),
    JSON.stringify(B.appliedFilter()));
  await set({ mode: "filter" });
  await tick();
  check("report: and its engine", (B.appliedFilter() || {}).mode === "filter",
    JSON.stringify(B.appliedFilter()));
  // Dynamic mode at default sliders paints no root filter at all, so there is
  // nothing below it to reverse - reported as such, not as "brightness 100".
  await set({ mode: "dynamic", brightness: 100, contrast: 100 });
  await tick();
  check("report: a top frame painting no root filter reports none",
    B.appliedFilter() === null, JSON.stringify(B.appliedFilter()));
  await set({ mode: "filter", brightness: 130 });
  await tick();
  await set({ enabled: false });
  await tick();
  check("report: a top frame that is switched off reports none",
    B.appliedFilter() === null, JSON.stringify(B.appliedFilter()));
  await set({ enabled: true, disabledSites: [B.HOST] });
  await tick();
  check("report: an excluded site reports none",
    B.appliedFilter() === null, JSON.stringify(B.appliedFilter()));
  await set({ disabledSites: [], siteOverrides: { [B.HOST]: { ...B.DEFAULTS, brightness: 145 } } });
  await tick();
  check("report: the site's own theme is what gets reported",
    (B.appliedFilter() || {}).brightness === 145, JSON.stringify(B.appliedFilter()));
  await set({ siteOverrides: {}, mode: "dynamic", brightness: 100, contrast: 100 });
  await tick();

  // --- the payload crosses postMessage, so it is rebuilt rather than trusted -
  // Any script on the page can post one of these, and the numbers land in a
  // stylesheet. A string that survived would close the declaration.
  const R = B.readAncestorFilter;
  check("payload: a non-object is no ancestor at all",
    R(null) === null && R("junk") === null && R(undefined) === null);
  const hostile = R({ mode: "filter", brightness: "1) } * { display: none } html {",
                      contrast: {}, sepia: NaN, grayscale: Infinity, themeImages: "yes" });
  check("payload: hostile values fall back to the neutral ones",
    hostile.brightness === 100 && hostile.contrast === 100 &&
    hostile.sepia === 0 && hostile.grayscale === 0 && hostile.themeImages === false,
    JSON.stringify(hostile));
  check("payload: and nothing of them reaches the stylesheet",
    !/display: none/.test(B.buildFilterCss({ ...B.DEFAULTS }, false, hostile)),
    norm(B.buildFilterCss({ ...B.DEFAULTS }, false, hostile)));
  check("payload: out-of-range sliders are refused",
    R({ brightness: 900, contrast: -5 }).brightness === 100 &&
    R({ brightness: 900, contrast: -5 }).contrast === 100);
  check("payload: an unknown engine is read as the non-inverting one",
    R({ mode: "haunted" }).mode === "dynamic");
  check("payload: values in range are kept",
    R({ mode: "filter", brightness: 130, contrast: 80, sepia: 10, grayscale: 20,
        themeImages: true }).brightness === 130);

  const filTuned = B.buildFilterCss({ ...B.DEFAULTS, brightness: 130, contrast: 80 }, true);
  check("media: filter mode reverses the sliders as well as the invert",
    /brightness/.test(mediaRule(filTuned)) && /invert\(1\)/.test(mediaRule(filTuned)),
    norm(mediaRule(filTuned)));
  check("media: opting in drops the re-invert too, so media inverts with the page",
    !/(^|\n)img, video, embed, object \{/.test(
      B.buildFilterCss({ ...B.DEFAULTS, themeImages: true }, true)));
  // Fullscreen media is in the top layer, outside <html>, so the root filter
  // never reaches it: true-to-colour media needs nothing, themed media needs
  // the whole treatment applied directly because nothing above it will.
  check("media: fullscreen media is left alone while true to colour",
    /video:fullscreen[^{]*\{[^}]*filter: none/.test(
      B.buildFilterCss({ ...B.DEFAULTS, brightness: 130 }, true)));
  check("media: fullscreen media is themed directly when opted in",
    /video:fullscreen[^{]*\{[^}]*invert\(1\)/.test(
      B.buildFilterCss({ ...B.DEFAULTS, themeImages: true }, true)));

  // --- the reversal is arithmetically exact ---------------------------------
  // CSS filter functions are affine maps on sRGB components: v -> m*v + o.
  // Composing the root chain with the media chain must land on the identity, or
  // media is being "exempted" into some third colour nobody asked for.
  const I3 = [[1,0,0],[0,1,0],[0,0,1]];
  const mul = (A, Bm) => A.map((r, i) => Bm[0].map((_, j) => r.reduce((t, v, k) => t + v * Bm[k][j], 0)));
  const apply = (m, v) => m.map((r) => r.reduce((t, x, k) => t + x * v[k], 0));
  const lin = (m, o = [0, 0, 0]) => ({ m, o });
  // Applying A then B: v -> Bm*(Am*v + Ao) + Bo
  const then = (A, Bf) => ({ m: mul(Bf.m, A.m), o: apply(Bf.m, A.o).map((x, i) => x + Bf.o[i]) });
  const SAT = (s) => lin([
    [0.213 + 0.787 * s, 0.715 - 0.715 * s, 0.072 - 0.072 * s],
    [0.213 - 0.213 * s, 0.715 + 0.285 * s, 0.072 - 0.072 * s],
    [0.213 - 0.213 * s, 0.715 - 0.715 * s, 0.072 + 0.928 * s]
  ]);
  const SEPIA_M = [[0.393,0.769,0.189],[0.349,0.686,0.168],[0.272,0.534,0.131]];
  const FN = {
    brightness: (a) => lin([[a,0,0],[0,a,0],[0,0,a]]),
    contrast: (a) => ({ m: [[a,0,0],[0,a,0],[0,0,a]], o: [0.5 - 0.5*a, 0.5 - 0.5*a, 0.5 - 0.5*a] }),
    saturate: SAT,
    grayscale: (g) => SAT(1 - g),
    sepia: (s) => lin(I3.map((r, i) => r.map((v, j) => (1 - s) * v + s * SEPIA_M[i][j]))),
    invert: () => ({ m: [[-1,0,0],[0,-1,0],[0,0,-1]], o: [1, 1, 1] }),
    "hue-rotate": (deg) => {
      const c = Math.cos(deg * Math.PI / 180), s = Math.sin(deg * Math.PI / 180);
      return lin([
        [0.213 + c*0.787 - s*0.213, 0.715 - c*0.715 - s*0.715, 0.072 - c*0.072 + s*0.928],
        [0.213 - c*0.213 + s*0.143, 0.715 + c*0.285 + s*0.140, 0.072 - c*0.072 - s*0.283],
        [0.213 - c*0.213 - s*0.787, 0.715 - c*0.715 + s*0.715, 0.072 + c*0.928 + s*0.072]
      ]);
    }
  };
  // Parses a CSS filter list left to right, which is also the order it applies.
  function compose(list) {
    let acc = lin(I3);
    for (const [, name, arg] of list.matchAll(/([a-z-]+)\(([^)]*)\)/g)) {
      if (!FN[name]) throw new Error("unmodelled filter function: " + name);
      const n = arg.endsWith("%") ? parseFloat(arg) / 100 : parseFloat(arg);
      acc = then(acc, FN[name](name === "hue-rotate" ? parseFloat(arg) : n));
    }
    return acc;
  }
  const isIdentity = (f) => {
    const dm = Math.max(...f.m.flatMap((r, i) => r.map((v, j) => Math.abs(v - I3[i][j]))));
    return Math.max(dm, ...f.o.map(Math.abs));
  };
  // Half of one 8-bit colour step: the largest drift that cannot change a
  // rendered pixel. An arbitrary epsilon would only be measuring how many
  // decimals the builder prints; this measures whether anyone could see it.
  const INVISIBLE = 1 / 255 / 2;
  for (const tune of [
    { brightness: 130 },
    { contrast: 80 },
    { brightness: 130, contrast: 80 },
    { brightness: 70, contrast: 140, grayscale: 60 },
    { grayscale: 100 }
  ]) {
    const s = { ...B.DEFAULTS, ...tune };
    const drift = isIdentity(then(compose(B.undoFilterValue(s)), compose(B.cssFilterValue(s, false))));
    const label = Object.entries(tune).map(([k, v]) => k + " " + v).join(", ");
    // 100% grayscale has destroyed the colour - nothing reverses that, and the
    // builder does not pretend otherwise. It is here to prove it fails loudly
    // rather than silently emitting a saturate(Infinity).
    if (tune.grayscale === 100) {
      check("media: 100% grayscale is left unreversed rather than faked",
        B.undoFilterValue(s) === "" && drift > 0.1, B.undoFilterValue(s) + " drift=" + drift.toFixed(4));
    } else {
      check(`media: dynamic reversal is exact (${label})`, drift < INVISIBLE, "drift=" + drift.toExponential(2));
    }
  }
  // Same claim through the invert pair, which is what filter mode actually ships.
  for (const tune of [{}, { brightness: 130, contrast: 80 }, { brightness: 90, grayscale: 40 }]) {
    const s = { ...B.DEFAULTS, ...tune };
    const media = `${B.undoFilterValue(s)} invert(1) hue-rotate(180deg)`.trim();
    const drift = isIdentity(then(compose(media), compose(B.cssFilterValue(s, true))));
    const label = Object.entries(tune).map(([k, v]) => k + " " + v).join(", ") || "defaults";
    check(`media: filter-mode reversal is exact (${label})`, drift < INVISIBLE, "drift=" + drift.toExponential(2));
  }
  // Same claim for a subframe, where the forward filter is the ancestor's and
  // the reversal is built from what the ancestor reported rather than from this
  // frame's own settings. Read out of the generated rule, so it is the shipped
  // string being composed, not a re-derivation of it.
  for (const [mode, tune] of [
    ["dynamic", { brightness: 130, contrast: 80 }],
    ["dynamic", { brightness: 70, contrast: 140, grayscale: 60 }],
    ["filter", { brightness: 130, contrast: 80 }],
    ["filter", {}]
  ]) {
    const top = ancestorOf({ ...B.DEFAULTS, ...tune }, mode);
    // This frame's own settings are the DEFAULTS throughout - a diverged host,
    // so nothing here can quietly be reversing its own values instead.
    const sub = mode === "filter"
      ? B.buildFilterCss({ ...B.DEFAULTS, mode }, false, top)
      : B.buildDynamicCss({ ...B.DEFAULTS }, false, top);
    const undo = (norm(mediaRule(sub)).match(/filter: ([^!]*)!important/) || [, ""])[1];
    const drift = isIdentity(then(compose(undo), compose(B.cssFilterValue(top, mode === "filter"))));
    const label = mode + " " + (Object.keys(tune).length ? JSON.stringify(tune) : "defaults");
    check(`pairing: subframe reversal is exact against what the top applied (${label})`,
      drift < INVISIBLE, "drift=" + drift.toExponential(2) + " undo=" + undo.trim());
  }
  // --- and it never makes a pixel worse ------------------------------------
  // The arithmetic above is exact, but a browser clamps to [0,1] between filter
  // primitives, and a reversal that has to raise contrast pushes near-white
  // above 1 and loses the headroom. What matters is the direction of the error:
  // media carrying the reversal must never come out further from its true
  // colour than media carrying nothing would have, or the exemption is costing
  // the thing it exists to protect. Modelled with the clamp the maths omits.
  const clamp = (v) => Math.min(1, Math.max(0, v));
  const bright = (a) => (v) => a * v;
  const contrast = (a) => (v) => a * v + (0.5 - 0.5 * a);
  const SLIDER_PAIRS = [[130, 80], [70, 140], [150, 150], [130, 100], [50, 60], [110, 90]];
  let everWorse = 0, inexactUnclipped = 0, clipped = 0, total = 0;
  // White specifically, because a photograph's white background is where the
  // clipping is visible and where the chain order was chosen to protect it.
  const whiteDrift = [];
  for (const [b, c] of SLIDER_PAIRS) {
    // Reversal then root filter, in the order they actually reach a pixel, and
    // in the order the builders emit them: contrast before brightness forward,
    // so brightness before contrast in reverse.
    const chain = [bright(100 / b), contrast(100 / c), contrast(c / 100), bright(b / 100)];
    const root = [contrast(c / 100), bright(b / 100)];
    for (let i = 0; i <= 255; i++) {
      const v = i / 255;
      total++;
      let exempt = v, bare = v, hitTheEdge = false;
      for (const f of chain) {
        const raw = f(exempt);
        if (raw < -1e-9 || raw > 1 + 1e-9) hitTheEdge = true;
        exempt = clamp(raw);
      }
      for (const f of root) bare = clamp(f(bare));
      if (Math.abs(exempt - v) > Math.abs(bare - v) + 1e-9) everWorse++;
      if (hitTheEdge) clipped++;
      else if (Math.abs(exempt - v) > 1e-6) inexactUnclipped++;
      if (i === 255) whiteDrift.push([b, c, Math.abs(exempt - v)]);
    }
  }
  // The guarantee: whatever the sliders are set to, media carrying the reversal
  // is never further from its true colour than media carrying nothing.
  check("media: the reversal never leaves a channel worse off than no reversal",
    everWorse === 0, everWorse + " of " + total + " channel values regressed");
  // And where the browser did not have to clamp, it is not merely better - it
  // is exact. What clipping costs is a highlight the root filter had already
  // destroyed before the media rule could protect it, which no element filter
  // can recover; at brightness 50 / contrast 60 white is simply gone.
  check("media: exact for every channel the root filter has not already clipped",
    inexactUnclipped === 0, inexactUnclipped + " inexact of " + (total - clipped) + " unclipped");
  // A brightened page is the case that matters: it is the setting that used to
  // blow white out before the media rule could protect it, and the reason the
  // forward chain puts contrast first. Whenever the page is brightened, the
  // reversal's own brightness step is a compression and cannot clip, so white
  // has to come back as white - the visible symptom was a photograph's white
  // background arriving grey on a site whose photography is mostly white.
  const brightened = whiteDrift.filter(([b]) => b >= 100);
  check("media: white survives the reversal exactly on a brightened page",
    brightened.length > 0 && brightened.every(([, , d]) => d < INVISIBLE),
    brightened.map(([b, c, d]) => `${b}/${c}:${d.toExponential(1)}`).join(" "));

  // Documented limitation, asserted so it cannot quietly become something else:
  // sepia has no inverse among the CSS filter functions, so a warm cast still
  // reaches media. Everything either side of it still cancels.
  const sep = { ...B.DEFAULTS, sepia: 40, brightness: 130 };
  check("media: sepia is knowingly left on media, not silently mis-reversed",
    !B.undoFilterValue(sep).includes("sepia") &&
    isIdentity(then(compose(B.undoFilterValue(sep)), compose(B.cssFilterValue(sep, false)))) > 0.01,
    B.undoFilterValue(sep));

  // --- and the clamp the arithmetic cannot see -------------------------------
  // The identities above compose matrices with nothing in between, and that gap
  // is the point: a browser rasterises an element's own filter to 8 bits before
  // an ancestor's filter reads it, and invert(1) hue-rotate(180deg) takes a
  // saturated channel outside [0,1] on that intermediate, where it clamps. What
  // clips there is gone before the root filter runs and no later filter gets it
  // back, so it is measured through two real rasterisations instead.
  const ROOT_CHAIN = B.cssFilterValue({ ...B.DEFAULTS, mode: "filter" }, true);
  const MEDIA_UNDO = B.mediaUndo({ ...B.DEFAULTS, mode: "filter" }, true);
  // Detached, so none of this reaches the observer or the shadow sweeps.
  const mini = () => Object.assign(document.createElement("canvas"), { width: 1, height: 1 });
  const pix = (cv) => cv.getContext("2d", { willReadFrequently: true });
  // ctx.filter keeps its previous value when a string is rejected, and a chain
  // that never applied would score perfect, so a rejection is recorded. The flag
  // is kept apart from the chain because "" is itself rejected, and as a chain
  // it would read as nothing having been recorded.
  let rejected = false, rejectedChain = "";
  const rasterise = (src, chain) => {
    const cv = mini(), p = pix(cv);
    p.filter = chain;
    if (p.filter === "none") { rejected = true; rejectedChain = chain; }
    p.drawImage(src, 0, 0);
    return cv;
  };
  const roundTrip = (hex, undo) => {
    const cv = mini(), p = pix(cv);
    p.fillStyle = hex;
    p.fillRect(0, 0, 1, 1);
    const truth = p.getImageData(0, 0, 1, 1).data;
    const back = pix(rasterise(rasterise(cv, undo), ROOT_CHAIN)).getImageData(0, 0, 1, 1).data;
    return Math.max(...[0, 1, 2].map((ch) => Math.abs(back[ch] - truth[ch])));
  };
  // This is the guarantee that holds, and it is what a themed page is mostly
  // made of: neutrals and anything muted come off the pair as themselves. The
  // tolerances sit a step or two above what was measured, so one 8-bit step of
  // rounding in a future Chrome is not a failure - what they are separating this
  // from is the saturated case, which is off by 186.
  const NEUTRALS = [["#ffffff", 1], ["#808080", 1], ["#000000", 1],
                    ["#7090b0", 1], ["#c08050", 4]];
  // Measured before the condition is written, because `rejected` says nothing
  // until a chain has actually been handed to a context - read any earlier and
  // the guard is the value it was initialised with, and always passes.
  const drifts = NEUTRALS.map(([hex, tol]) => [hex, roundTrip(hex, MEDIA_UNDO), tol]);
  check("media: neutral and muted colour come back through both rasterisations",
    !rejected && drifts.every(([, drift, tol]) => drift <= tol),
    drifts.map(([hex, drift]) => hex + ":" + drift).join(" ") +
      (rejected ? " rejected: " + rejectedChain : ""));
  // Saturated colour is where it stops, and that is pinned rather than hoped
  // for: pure blue leaves most of a channel in the clamp. If this ever comes
  // back clean the limitation has been fixed and the claim needs rewriting.
  check("media: a saturated colour is knowingly lost to the clamp, not nearly kept",
    roundTrip("#0000ff", MEDIA_UNDO) > 100, "blue off by " + roundTrip("#0000ff", MEDIA_UNDO));
  // And reordering the pair is not the missing fix - the clamp sits between the
  // two rasterisations whichever way round the two functions are written.
  const altOrder = roundTrip("#0000ff", "hue-rotate(180deg) invert(1)");
  check("media: reordering the invert pair recovers none of it",
    Math.abs(altOrder - roundTrip("#0000ff", MEDIA_UNDO)) <= 2,
    "alt " + altOrder + " vs " + roundTrip("#0000ff", MEDIA_UNDO));

  // --- what "theme images and video" governs ---------------------------------
  // Not css background images. Dropping those is dynamic mode's answer to a
  // light hero or gradient surviving the colour override, and it is
  // unconditional - pinned so it cannot quietly be hung off this setting.
  const themedOff = B.buildDynamicCss({ ...B.DEFAULTS, themeImages: false });
  const themedOn = B.buildDynamicCss({ ...B.DEFAULTS, themeImages: true });
  const bgRule = (c) => /\*[^{]*\{\s*background-image: none !important;/.test(c);
  check("media: css background images are dropped whichever way the setting is set",
    bgRule(themedOff) && bgRule(themedOn));
  // At default sliders dynamic mode emits no media filter at all, so the
  // setting has nothing to act on and the sheet does not move by a byte.
  check("media: at default sliders the setting has nothing to undo and changes nothing",
    themedOn === themedOff, themedOn.length + " bytes either way");
  // Which is arithmetic, not a dead control: move a slider and it is live
  // again, and this is the check that stops the one above reading otherwise.
  const tunedThemed = B.buildDynamicCss(
    { ...B.DEFAULTS, brightness: 130, contrast: 80, themeImages: true });
  // Located with mediaRule() rather than by substring: the top-layer pass names
  // img inside a :not(), which is the opposite of filtering one.
  check("media: with a slider moved the setting decides whether media is reversed",
    tunedThemed !== dynTuned && /filter:/.test(mediaRule(dynTuned)) &&
    !mediaRule(tunedThemed), norm(mediaRule(tunedThemed)) || norm(mediaRule(dynTuned)));

  // --- a site's own theme ----------------------------------------------------
  const withOwn = { ...B.DEFAULTS, mode: "dynamic", brightness: 100,
                    siteOverrides: { [B.HOST]: { mode: "filter", brightness: 130, contrast: 80,
                                                 sepia: 0, grayscale: 0, themeImages: true } } };
  check("override: this host is painted with its own theme",
    B.effective(withOwn).mode === "filter" && B.effective(withOwn).brightness === 130,
    JSON.stringify(B.effective(withOwn).mode));
  check("override: it reaches the stylesheet, not just the object",
    B.buildCss(B.effective(withOwn)).includes("invert(1)"));
  check("override: another host's theme is not borrowed",
    B.effective({ ...withOwn, siteOverrides: { "somewhere-else.example": { mode: "filter" } } }).mode
      === "dynamic");
  // Exact host for theme overrides and exclusions alike.
  check("override: a parent domain's theme is not inherited",
    B.effective({ ...withOwn, siteOverrides: { "example.com": { mode: "filter" } } }).mode === "dynamic");
  check("override: policy stays shared - an override cannot re-enable a disabled site",
    B.siteDisabled({ ...withOwn, disabledSites: [B.HOST] }) === true);
  check("override: a corrupt entry falls back to the shared settings rather than throwing",
    B.effective({ ...B.DEFAULTS, siteOverrides: "not-an-object" }).mode === "dynamic" &&
    B.effective({ ...B.DEFAULTS, siteOverrides: { [B.HOST]: "junk" } }).mode === "dynamic");

  // --- which page a hostless document belongs to ----------------------------
  // manifest.json sets match_about_blank, so this script also runs in documents
  // whose URL carries no host at all. Those answered to no per-site rule: every
  // list check came back false, so a site the user had excluded still had its
  // about:blank popups themed. A Slack huddle is exactly that - a
  // window.open("about:blank") whose call controls kept being inverted on an
  // excluded app.slack.com - which is the case the last three fallbacks cover.
  const win = (over = {}) => ({ top: over.top, opener: null, parent: null, ...over });
  const loc = (over = {}) => ({ hostname: "", origin: "null", ancestorOrigins: null, ...over });
  const self = {};
  self.top = self;
  self.parent = self;

  check("host: an ordinary page answers with its own hostname",
    B.resolveHost(win({ top: self }), loc({ hostname: "www.example.com", origin: "https://www.example.com" })) === "example.com");
  check("host: a subframe answers with the top frame's, so a page is one theme",
    B.resolveHost(win({ top: {} }), loc({ hostname: "ads.vendor.com", ancestorOrigins: ["https://example.com"] })) === "example.com");
  // The inherited origin is the first thing tried: it needs no cross-window
  // access, so it is the only one a sandboxed or detached document can answer.
  check("host: an about:blank window inherits the origin that opened it",
    B.resolveHost(win({ top: self }), loc({ origin: "https://app.slack.com" })) === "app.slack.com");
  check("host: and falls back to the opener when the origin is opaque",
    B.resolveHost(win({ top: self, opener: { location: { hostname: "www.app.slack.com" } } }), loc()) === "app.slack.com");
  check("host: and to the parent when there is no opener",
    B.resolveHost(win({ top: {}, parent: { location: { hostname: "app.slack.com" } } }), loc()) === "app.slack.com");
  // A blank tab the user opened themselves belongs to no page, and theming it
  // is right - what must not happen is inventing a host for it.
  check("host: a document that belongs to no page resolves to no host",
    B.resolveHost(win({ top: self }), loc()) === "");
  // A frame still answers with the top frame's host even when it has one of its
  // own, so the fallbacks cannot quietly reorder into a subframe answering for
  // itself - that would split one page across two per-site answers.
  check("host: the top frame still wins over a subframe's own hostname",
    B.resolveHost(win({ top: {} }),
      loc({ hostname: "ads.vendor.com", origin: "https://ads.vendor.com",
            ancestorOrigins: ["https://outer.com", "https://example.com"] })) === "example.com");
}

// ---------------------------------------------------------------------------
// Suite: the frame outlives the extension.
//
// Reloading, disabling or updating the extension kills the chrome.* bridge in
// every frame already running the script, and every call made after that throws
// outright. The rechecks armDetection schedules are the exposed path - they fire
// 1s and 3s after DOMContentLoaded and reach chrome.storage.local through
// rememberVerdict.
//
// The liveness poll cannot cover them. It runs every 5s, so a recheck always
// gets there first; and on a page the engine stepped aside from it is not
// running at all, because nothing was injected for it to reclaim. That page is
// this one, which is why the suite loads against an already-dark body.
// ---------------------------------------------------------------------------
async function invalidatedSuite() {
  await waitUntil(() => !!window.__mm.settings);
  await waitUntil(() => window.__mm.nativeDark === true);

  check("invalidated: the engine stepped aside from this page", !styleEl());
  check("invalidated: nothing polls for the bridge on a stepped-aside page",
    window.__mm.deadCheck === null, "deadCheck=" + window.__mm.deadCheck);
  check("invalidated: rechecks are scheduled there all the same",
    window.__mm.detectTimers.length > 0, "armed=" + window.__mm.detectTimers.length);

  // The reload, exactly as Chrome delivers it: no notification and no callback -
  // the id simply goes, and the next call throws.
  const uncaught = [];
  const onError = (e) => uncaught.push(e.message || String(e.error));
  window.addEventListener("error", onError);
  chrome.runtime.id = undefined;

  // Emptying the list is the observable proof that a recheck fired and reclaimed
  // the frame. Polled rather than slept: an unfocused tab throttles timers, and
  // without the guard nothing ever clears it, so this is also the fail path.
  await waitUntil(() => window.__mm.detectTimers.length === 0, 8000);
  window.removeEventListener("error", onError);

  check("invalidated: a recheck firing after the reload throws nothing",
    uncaught.length === 0, uncaught.join(" | "));
  check("invalidated: the frame dropped its pending rechecks",
    window.__mm.detectTimers.length === 0, "left " + window.__mm.detectTimers.length);

  // Backstop, free of the timing above: calling the recheck by hand is exactly
  // what those timers do.
  let thrown = null;
  try {
    window.__mm.checkNativeDark();
  } catch (e) {
    thrown = e && (e.message || String(e));
  }
  check("invalidated: a recheck run against a dead bridge throws nothing",
    thrown === null, thrown);
}

// ---------------------------------------------------------------------------
// Suites: a real subframe, with and without a top frame running the extension.
//
// The builder assertions in the main suite pin down what a subframe emits for a
// given ancestor. These two pin down the other half: that the ancestor it is
// told about is the one that actually exists. `frames` runs the extension in
// both documents, which is the ordinary case; `orphan` runs it only in the
// subframe, which is what happens whenever Chrome declines the top document - a
// file:// page without file access, another extension's page - while injecting
// into an http(s) frame inside it.
// ---------------------------------------------------------------------------
let frameWin = null;

async function bootFrame() {
  const el = document.createElement("iframe");
  el.id = "subframe";
  el.style.cssText = "width:160px;height:90px;border:1px solid #ccc";
  const ready = new Promise((res) => {
    const on = (e) => {
      if (e.data && e.data.type === "frame:ready") { window.removeEventListener("message", on); res(); }
    };
    window.addEventListener("message", on);
  });
  el.src = "frame.html";
  document.body.appendChild(el);
  await ready;
  frameWin = el.contentWindow;
}

function askFrame() {
  return new Promise((resolve) => {
    const on = (e) => {
      if (!e.data || e.data.type !== "frame:state") return;
      window.removeEventListener("message", on);
      resolve(e.data);
    };
    window.addEventListener("message", on);
    frameWin.postMessage({ type: "frame:report" }, "*");
  });
}

// chrome.storage.sync is shared by every frame on a page, so a write has to
// reach both mocks.
function setBoth(patch) {
  frameWin.postMessage({ type: "frame:set", patch }, "*");
  return set(patch);
}

// One frame only, which is what two frames disagreeing about their own host
// amounts to: same page, same storage, different answers.
function setFrameOnly(patch) {
  frameWin.postMessage({ type: "frame:set", patch }, "*");
}

async function frameSettles(pred, ms = 5000) {
  const t0 = performance.now();
  let s = await askFrame();
  while (!pred(s) && performance.now() - t0 < ms) {
    await tick(40);
    s = await askFrame();
  }
  return s;
}

const REVERSED = /brightness\(0\.76/;   // the reverse of brightness 130

async function framesSuite() {
  await waitUntil(() => !!window.__mm.settings);
  await bootFrame();

  let s = await askFrame();
  check("frames: the subframe knows it is not the top frame", s.isTop === false);
  check("frames: it is themed", !!s.css);
  // Defaults: the top frame paints no root filter at all in dynamic mode, so
  // there is nothing below it to reverse and it says so.
  s = await frameSettles((x) => x.ancestor === null);
  check("frames: a top frame painting no root filter tells the subframe none",
    s.ancestor === null, JSON.stringify(s.ancestor));
  check("frames: so the subframe leaves its media alone",
    s.picFilter === "none", s.picFilter);

  await setBoth({ brightness: 130, contrast: 80 });
  s = await frameSettles((x) => !!x.ancestor);
  check("frames: the top frame's sliders reach the subframe",
    s.ancestor && s.ancestor.brightness === 130 && s.ancestor.contrast === 80,
    JSON.stringify(s.ancestor));
  check("frames: and the subframe re-renders its sheet to reverse them",
    REVERSED.test(s.picFilter) && /contrast\(1\.25/.test(s.picFilter), s.picFilter);

  // The isolated case: both frames stay themed, but the top frame's root filter
  // goes away. The reversal has to go with it - it was never this frame's own
  // setting, it was compensation.
  await setBoth({ brightness: 100, contrast: 100 });
  s = await frameSettles((x) => x.ancestor === null);
  check("frames: the root filter going away withdraws the reversal",
    s.ancestor === null && s.picFilter === "none", s.picFilter);
  check("frames: while the subframe stays themed", !!s.css);

  // --- divergence ---
  // What an opaque-origin top document actually produces: ancestorOrigins
  // serialises to the string "null", the subframe falls back to its own
  // hostname, and the two frames resolve different per-site answers from the
  // same page. Modelled by writing to one frame's settings and not the other's,
  // which is the same thing from here: the reversal is only ever right if it
  // came from what the top frame applied.
  setFrameOnly({ brightness: 130, contrast: 80 });
  await tick(250);
  s = await askFrame();
  check("frames: a subframe reverses nothing when the top applies nothing, whatever its own sliders say",
    s.picFilter === "none" && s.ancestor === null, s.picFilter + " own sheet=" +
      (/filter:/.test((s.css || "").split("}").find((r) => /(^|\n)\s*img/.test(r) && r.includes("filter:")) || "")));
  setFrameOnly({ brightness: 100, contrast: 100 });
  await set({ brightness: 130, contrast: 80 });
  s = await frameSettles((x) => !!x.ancestor);
  check("frames: and reverses the top frame's sliders even when its own say there is nothing to undo",
    REVERSED.test(s.picFilter), s.picFilter);
  await setBoth({ brightness: 100, contrast: 100 });
  await frameSettles((x) => x.ancestor === null);

  // Filter mode: everything the subframe emits there is compensation for the
  // top frame's inversion, so it arrives with the news that there is one.
  await setBoth({ mode: "filter" });
  s = await frameSettles((x) => !!x.ancestor && x.ancestor.mode === "filter");
  check("frames: the top frame's engine reaches the subframe too",
    s.ancestor.mode === "filter", JSON.stringify(s.ancestor));
  check("frames: only now does the subframe re-invert its media",
    /invert\(1\)/.test(s.picFilter), s.picFilter);
  check("frames: and pin color-scheme light for the inversion to work on",
    /color-scheme: light/.test(s.css || ""));
  check("frames: the subframe never emits a root filter of its own",
    !/(^|\n)html \{/.test((s.css || "").replace(/\/\*[\s\S]*?\*\//g, "")), norm(s.css || ""));

  // Switching the extension off has to reach the subframe as well - through the
  // shared settings, not the channel, but the channel must not leave anything
  // of the old state behind.
  await setBoth({ enabled: false });
  s = await frameSettles((x) => !x.css);
  check("frames: switching off strips the subframe too",
    !s.css && s.picFilter === "none", s.picFilter);
  check("frames: and the ancestor filter is withdrawn with it",
    s.ancestor === null, JSON.stringify(s.ancestor));
}

async function orphanSuite() {
  check("orphan: the top document is not running the extension", !window.__mm);
  await bootFrame();

  let s = await askFrame();
  check("orphan: the subframe is running it", !!s.css);
  check("orphan: nothing ever answers its query", s.ancestor === null, JSON.stringify(s.ancestor));
  check("orphan: so it reverses nothing", s.picFilter === "none", s.picFilter);

  // The failure this suite exists for: sliders set, a subframe that themes
  // itself, and no ancestor filter anywhere. Emitting the reversal here crushes
  // every image in the frame - it is the adjustment applied backwards, once.
  await setBoth({ brightness: 130, contrast: 80 });
  await frameSettles((x) => (x.css || "").includes("brightness"), 2000);
  await tick(200);
  s = await askFrame();
  check("orphan: an unpaired subframe still reverses nothing",
    s.picFilter === "none" && s.ancestor === null, s.picFilter);
  check("orphan: it is genuinely themed, not simply switched off",
    !!s.css && s.css.includes(THEME_TOKENS.background));

  // Filter mode is the visible one: a lone re-invert renders every photo as a
  // colour negative, and color-scheme light forces the site's light theme with
  // nothing to invert it.
  await setBoth({ mode: "filter" });
  await tick(300);
  s = await askFrame();
  check("orphan: an unpaired filter-mode subframe emits nothing at all",
    s.css === "", JSON.stringify(s.css));
  check("orphan: no lone re-invert on its media", s.picFilter === "none", s.picFilter);
}

function $id(id) { return document.getElementById(id); }

// ---------------------------------------------------------------------------
(async () => {
  try {
    // The verdict is taken as soon as the settings read resolves, so the page
    // must already look dark when content.js loads.
    if (MODE === "nativedark" || MODE === "invalidated") document.body.style.backgroundColor = "#111213";
    if (MODE === "earlycss") await installEarlyCss();
    // A remembered verdict from a previous visit, in place before content.js
    // reads it. The page itself stays light, so the hint is wrong on purpose.
    if (MODE === "hint") {
      localStore.nativeDarkHosts = ["unrelated.example", location.hostname.replace(/^www\./, "")];
    }
    // Everything but "orphan" loads the extension into this top document. That
    // suite exists precisely because Chrome sometimes does not.
    if (MODE !== "orphan") await loadContentScript();
    if (MODE === "pending") await pendingSuite();
    else if (MODE === "nativedark") await nativeDarkSuite();
    else if (MODE === "earlycss") await earlyCssSuite();
    else if (MODE === "hint") await hintSuite();
    else if (MODE === "invalidated") await invalidatedSuite();
    else if (MODE === "frames") await framesSuite();
    else if (MODE === "orphan") await orphanSuite();
    else await mainSuite();
  } catch (e) {
    check("harness ran without throwing", false, (e && e.message) + " " + (e && e.stack || "").split("\n")[1]);
  }
  check("no exception thrown from a storage.onChanged listener",
    listenerErrors.length === 0, listenerErrors.join(" | "));
  paint(true);
})();
</script>
